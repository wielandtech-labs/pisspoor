# Lint + unit tests. Runs on the shared org runner pool (homelab-dind) — the
# only pool visible to wielandtech-labs repos other than w_homelab. Tests need
# no Docker daemon; SQLite backs them so no Postgres service is required.
name: Test

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: homelab-dind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check . && ruff format --check .

      - name: Django system checks
        run: python manage.py check --deploy --fail-level ERROR
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          ALLOWED_HOSTS: example.invalid

      - name: Tests
        run: pytest
